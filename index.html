<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodvibes — Fiche & Contrat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#141310;
    --paper:#F6F4EF;
    --paper-raised:#FFFFFF;
    --line:#D8D3C7;
    --muted:#7A7568;
    --brass:#8B7345;
    --brass-deep:#6E5A33;
    --error:#A13B2B;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 120px;}
  .eyebrow{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .logo{
    margin:6px 0 0;
    display:block;
  }
  .logo svg{
    height:31px;
    width:auto;
    display:block;
  }
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    margin-bottom:36px;
  }
  header.top .meta{text-align:right;}
  header.top .meta .eyebrow{margin-bottom:4px;}
  h2.section-title{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:21px;
    margin:0 0 4px;
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  h2.section-title .num{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:500;
    font-size:13px;
    color:var(--brass);
    border:1px solid var(--brass);
    width:22px;height:22px;
    border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    flex:none;
  }
  .section{
    margin-bottom:44px;
    padding-top:8px;
  }
  .section-sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 20px 34px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 24px;
    margin-left:34px;
  }
  .field-grid.single{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span2{grid-column:1 / -1;}
  label.flabel{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .static-val{
    font-size:15px;
    padding:9px 0 9px 2px;
    border-bottom:1px dotted var(--line);
    min-height:20px;
  }
  input.finput, textarea.finput, select.finput{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size:15px;
    padding:9px 2px;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
    border-radius:0;
    appearance:none;
    -webkit-appearance:none;
  }
  input.finput:focus, textarea.finput:focus, select.finput:focus{border-bottom-color:var(--brass);}
  textarea.finput{resize:vertical;min-height:44px;font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;}
  select.finput{cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237A7568' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 2px center;background-size:14px;padding-right:20px;}
  .admin-panel input.finput, .admin-panel textarea.finput, .admin-panel select.finput{border-bottom:1px solid var(--line);}

  .cgv-box{
    margin-left:34px;
    border:1px solid var(--line);
    background:var(--paper-raised);
  }
  .cgv-tabs{
    display:flex;
    border-bottom:1px solid var(--line);
  }
  .cgv-tab{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:.08em;
    padding:10px 16px;
    cursor:pointer;
    color:var(--muted);
    background:none;
    border:none;
    border-right:1px solid var(--line);
  }
  .cgv-tab.active{color:var(--ink);background:var(--paper);}
  .cgv-content{
    max-height:220px;
    overflow-y:auto;
    padding:18px 20px;
    font-size:13.5px;
    line-height:1.6;
    color:#3a3730;
  }
  .cgv-content h4{font-size:12.5px;margin:14px 0 4px;font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-weight:700;letter-spacing:.02em;}
  .cgv-content h4:first-child{margin-top:0;}
  .cgv-content p{margin:0 0 4px;}
  .accept-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:16px 20px;
    border-top:1px solid var(--line);
    background:#FBFAF7;
  }
  .accept-row input[type=checkbox]{
    width:16px;height:16px;margin-top:2px;accent-color:var(--brass-deep);flex:none;
  }
  .accept-row label{font-size:13.5px;line-height:1.5;}

  .sig-wrap{margin-left:34px;}
  canvas#sigpad{
    width:100%;
    height:160px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    touch-action:none;
    display:block;
  }
  .sig-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:8px;
  }
  .sig-hint{font-size:12px;color:var(--muted);}
  .btn-ghost{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:7px 12px;cursor:pointer;border-radius:var(--radius);
  }
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

  .submit-bar{
    margin-left:34px;
    margin-top:36px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .btn-primary{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    background:var(--ink);color:var(--paper);
    border:none;padding:15px 26px;cursor:pointer;
    border-radius:var(--radius);
    transition:background .15s ease;
  }
  .btn-primary:hover{background:var(--brass-deep);}
  .btn-primary:disabled{background:#c9c4b6;cursor:not-allowed;}
  .warn-msg{color:var(--error);font-size:12.5px;display:none;}

  .success-screen{text-align:center;padding:60px 20px;}
  .success-screen .stamp{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;
    font-size:22px;color:var(--brass-deep);
    border:2px solid var(--brass-deep);
    display:inline-block;padding:14px 30px;
    transform:rotate(-2deg);
    margin-bottom:20px;
  }
  .success-screen p{color:var(--muted);font-size:14px;max-width:420px;margin:0 auto 24px;}

  footer.pagefoot{
    margin-top:60px;padding-top:20px;border-top:1px solid var(--line);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-size:11px;color:var(--muted);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  }

  /* admin */
  .admin-panel .link-box{
    margin-left:34px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:16px;
    display:none;
  }
  .admin-panel .link-box.show{display:block;}
  .link-row{display:flex;gap:8px;align-items:center;}
  .link-row input{
    flex:1;font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-size:12px;
    padding:9px 10px;border:1px solid var(--line);background:var(--paper);
  }
  .copied-msg{font-size:11px;color:var(--brass-deep);margin-top:6px;display:none;font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-weight:700;}

  .admin-table{width:100%;border-collapse:collapse;margin-left:34px;width:calc(100% - 34px);font-size:13px;}
  .admin-table th,.admin-table td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top;}
  .admin-table th{font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-weight:700;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

  @media(max-width:640px){
    .field-grid{grid-template-columns:1fr;margin-left:0;}
    .section-sub, .cgv-box, .sig-wrap, .submit-bar, .admin-table, .admin-panel .link-box{margin-left:0;}
    header.top{flex-direction:column;align-items:flex-start;gap:14px;}
    header.top .meta{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

const params = new URLSearchParams(location.search);
const app = document.getElementById('app');

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function b64encode(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
}
function b64decode(str){
  return JSON.parse(decodeURIComponent(escape(atob(str))));
}

/* URL de l'Apps Script (déclarée ici car utilisée par le routing court juste
   en dessous, et aussi plus bas pour l'envoi des contrats signés). */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIU-PQC85ilSrabe1NHy92M04-dNLVy1FcsNMkPwzKbaio2LKr46KadYW8I8eCR8I2qA/exec";

/* Récupère les données d'un lien court auprès de l'Apps Script. */
async function fetchLinkData(id){
  const res = await fetch(APPS_SCRIPT_URL + '?id=' + encodeURIComponent(id));
  const json = await res.json();
  if(!json.ok) throw new Error('link not found');
  return json.data;
}

/* Envoie les données au backend, qui les stocke et renvoie un identifiant
   court. En cas d'échec (ex : backend non à jour), une exception est levée
   et le code appelant se rabat automatiquement sur l'ancien lien long. */
async function createShortLink(type, data){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'createLink', type, data })
  });
  const json = await res.json();
  if(!json.ok || !json.id) throw new Error('createLink failed');
  return json.id;
}

/* ============================ ADMIN ACCESS CODE ============================
   Changez ce code, puis réhébergez le fichier (aucune autre étape requise).
   Protection simple côté client : suffisant pour dissuader un visiteur au
   hasard, pas un mécanisme de sécurité fort. */
const ADMIN_PASSCODE = "goodvibes2026";

function renderPasscodeGate(onSuccess){
  app.innerHTML = `
  <header class="top">
    <div><div class="logo">${GV_LOGO}</div></div>
  </header>
  <div class="section">
    <h2 class="section-title"><span class="num">·</span>Accès privé</h2>
    <p class="section-sub">Cette page est réservée à Goodvibes.</p>
    <div class="field-grid single">
      <div class="field"><label class="flabel">Code d'accès</label><input class="finput" type="password" id="passInput"></div>
    </div>
    <div class="submit-bar" style="margin-top:20px;">
      <button class="btn-primary" id="passBtn">Entrer</button>
      <span class="warn-msg" id="passWarn">Code incorrect.</span>
    </div>
  </div>`;
  const tryUnlock = () => {
    if(document.getElementById('passInput').value === ADMIN_PASSCODE){ onSuccess(); }
    else { document.getElementById('passWarn').style.display='inline'; }
  };
  document.getElementById('passBtn').addEventListener('click', tryUnlock);
  document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
}

/* ============================ ROUTING ============================
   Compatible avec deux formats de lien :
   - Ancien format (long) : toutes les données encodées en base64 dans l'URL.
   - Nouveau format (court) : un identifiant (?d=abc123 ou ?dj=abc123) qui
     pointe vers des données stockées côté Apps Script. Si le décodage
     base64 local échoue (ce qui est le cas pour un court identifiant),
     on va chercher les données auprès du backend. */
async function routeClient(raw){
  try{ renderClientForm(b64decode(raw)); return; }catch(e){}
  try{ renderClientForm(await fetchLinkData(raw)); }
  catch(e){ renderError(); }
}
async function routeDJ(raw){
  try{ renderDJSheet(b64decode(raw)); return; }catch(e){}
  try{ renderDJSheet(await fetchLinkData(raw)); }
  catch(e){ renderError(); }
}
if(params.get('d')){
  routeClient(params.get('d'));
} else if(params.get('dj')){
  routeDJ(params.get('dj'));
} else {
  renderPasscodeGate(renderAdminBuilder);
}

    <div class="cgv-box">

    <span>www.goodvibes.be</span>
  </footer>

  // CGV tabs
  document.getElementById('cgvTabs').addEventListener('click', (e)=>{
    if(!e.target.dataset.lang) return;
    document.querySelectorAll('.cgv-tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('cgvContent').innerHTML = CGV[e.target.dataset.lang].body;
  });

  // Signature pad
  const canvas = document.getElementById('sigpad');
  const ctx = canvas.getContext('2d');
  function fitCanvas(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = rect.height * 2;
    ctx.scale(2,2);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#141310';
  }
  fitCanvas();
  let drawing=false, hasSig=false, lastX=0, lastY=0;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  function start(e){ drawing=true; hasSig=true; const p=pos(e); lastX=p.x; lastY=p.y; e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y; e.preventDefault();
  }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  document.getElementById('clearSig').addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasSig=false;
  });

  document.getElementById('submitBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('c_name').value.trim();
    const org = document.getElementById('c_org').value.trim();
    const phone = document.getElementById('c_phone').value.trim();
    const email = document.getElementById('c_email').value.trim();
    const site = document.getElementById('c_site').value.trim();
    const summary = document.getElementById('c_summary').value.trim();
    const accepted = document.getElementById('c_accept').checked;

    if(!name || !phone || !email || !accepted || !hasSig){
      document.getElementById('warnMsg').style.display='inline';
      return;
    }
    document.getElementById('warnMsg').style.display='none';

    const sigDataUrl = canvas.toDataURL('image/png');
    const signedAt = new Date();
    const record = {
      ...data,
      clientName:name, clientOrg:org, clientPhone:phone, clientEmail:email, clientSite:site,
      summary:summary,
      cgvAccepted:true,
      signedAt: signedAt.toISOString(),
      signatureImg: sigDataUrl
    };

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('submitBtn').textContent = 'Signature en cours…';

    const { doc, filename } = await buildPDFDoc(record);
    const pdfBase64 = doc.output('datauristring'); // pour l'envoi à Apps Script
    doc.save(filename); // téléchargement local pour le client

    await sendToGoogleSheet({ ...record, pdfBase64 });
    renderSuccess(record);
  });
}

    <h2 class="section-title"><span class="num">2</span>Votre prestation</h2>
    <div class="field-grid">
      ${staticField('DJ', data.dj)}
      ${staticField('Contact DJ', data.djcontact)}
      ${data.dress ? staticField('Dresscode', data.dress) : ''}
      ${staticField('Heure d\u2019arrivée', data.arrival)}
      ${staticField('Pack', data.pack)}
      ${staticField('Cachet DJ (HTVA)', data.djfee)}
      ${data.djbriefing ? staticField('Briefing', data.djbriefing, true) : ''}
    </div>
  </div>

  <footer class="pagefoot">
    <span>Goodvibes, Avenue Louise 367, 1050 Bruxelles</span>
    <span>www.goodvibes.be</span>
  </footer>
  `;
}

/* ============================ PDF GENERATION ============================ */

// Convertit le logo SVG (ou toute autre SVG) en PNG haute résolution pour l'insérer dans le PDF
function svgToPngDataUrl(svgMarkup, naturalW, naturalH, scale){
  return new Promise((resolve, reject)=>{
    const svgWithSize = svgMarkup.replace('<svg ', `<svg width="${naturalW}" height="${naturalH}" `);
    const blob = new Blob([svgWithSize], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = naturalW * scale;
      canvas.height = naturalH * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = url;
  });
}

async function buildPDFDoc(r){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const left = 56, right = W-56;
  const contentW = right-left;

  // Palette identique aux variables CSS de l'app
  const INK = [20,19,16], MUTED=[122,117,104], LINE=[216,211,199], BRASS=[139,115,69];

  const logoPng = await svgToPngDataUrl(GV_LOGO, 1145, 397, 3);
  const logoW = 92, logoH = logoW * (397/1145);

  let y = 0;
  const pageBg = () => { doc.setFillColor(246,244,239); doc.rect(0,0,W,H,'F'); };
  pageBg();

  const ensureSpace = (needed) => {
    if(y + needed > H - 70){
      doc.addPage(); pageBg();
      y = 56;
    }
  };

  // --- HEADER ---
  y = 56;
  doc.addImage(logoPng, 'PNG', left, y-21, logoW, logoH);
  const logoCenterY = (y-21) + logoH/2;
  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK);
  doc.text('CONFIRMATION DE BOOKING', right, logoCenterY+3, {align:'right'});
  y += 22;
  const eyebrow = (r.type || '').toUpperCase();
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);
  if(eyebrow) doc.text(eyebrow, right, y-11, {align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...INK);
  doc.text(r.event || '', right, y, {align:'right'});
  y += 16;
  doc.setDrawColor(...LINE); doc.line(left, y, right, y);
  y += 24;

  // --- Helpers de mise en page façon "field-grid" à 2 colonnes ---
  const colW = (contentW - 24) / 2;
  const col2X = left + colW + 24;

  function sectionTitle(num, title){
    ensureSpace(36);
    doc.setDrawColor(...BRASS); doc.setLineWidth(1);
    doc.circle(left+6.5, y-4, 7.5, 'S');
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...BRASS);
    doc.text(String(num), left+6.5, y-1, {align:'center'});
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...INK);
    doc.text(title, left+22, y);
    y += 18;
  }

  function fieldPair(label, value, colX, w){
    const lines = doc.splitTextToSize(String(value||'—'), w);
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
    doc.text(label.toUpperCase(), colX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(lines, colX, y+10.5);
    return 10.5 + lines.length*11 + 9;
  }

  // Affiche une liste de [label, value] en grille 2 colonnes façon field-grid,
  // avec les champs "pleine largeur" (span2) affichés seuls sur leur ligne
  function fieldGrid(rows, span2Labels){
    span2Labels = span2Labels || [];
    let i = 0;
    while(i < rows.length){
      const [label, value] = rows[i];
      if(span2Labels.includes(label)){
        ensureSpace(50);
        const h = fieldPair(label, value, left, contentW);
        y += h;
        i += 1;
      } else if(i+1 < rows.length && !span2Labels.includes(rows[i+1][0])){
        ensureSpace(50);
        const h1 = fieldPair(rows[i][0], rows[i][1], left, colW);
        const h2 = fieldPair(rows[i+1][0], rows[i+1][1], col2X, colW);
        y += Math.max(h1,h2);
        i += 2;
      } else {
        ensureSpace(50);
        const h = fieldPair(label, value, left, colW);
        y += h;
        i += 1;
      }
    }
  }

  // --- SECTION 1 : Événement & prestation (rempli par Goodvibes) ---
  sectionTitle(1, 'Événement & prestation');
  fieldGrid([
    ['Événement', r.event], ['Type', r.type],
    ['Date', r.date], ['Horaires', r.timing],
    ['Adresse', r.addr], ['Client', r.company],
    ['DJ', r.dj], ['Contact DJ', r.djcontact],
    ['Dresscode', r.dress], ['Arrivée DJ', r.arrival],
    ['Pack', r.pack], ['Honoraires (HTVA)', r.fee]
  ], ['Adresse']);
  y += 8;

  // --- SECTION 2 : Vos informations (rempli par le client) ---
  sectionTitle(2, 'Vos informations');
  fieldGrid([
    ['Nom complet', r.clientName], ['Société', r.clientOrg],
    ['Téléphone', r.clientPhone], ['Email', r.clientEmail],
    ['Contact sur site', r.clientSite],
    ['Direction musicale & briefing', r.summary]
  ], ['Direction musicale & briefing']);
  y += 8;

  // --- SECTION 3 : Conditions générales ---
  ensureSpace(60);
  sectionTitle(3, 'Conditions générales');
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  const legal = "Le client reconnait avoir lu et accepté les Conditions Generales de Vente de Goodvibes. Signature electronique simple au sens du Reglement eIDAS (UE) 910/2014.";
  const legalLines = doc.splitTextToSize(legal, contentW);
  doc.text(legalLines, left, y);
  y += 11*legalLines.length + 18;

  // --- SECTION 4 : Signatures ---
  ensureSpace(110);
  sectionTitle(4, 'Signatures');
  const sigColW = (contentW - 24)/2;
  const sigCol2X = left + sigColW + 24;
  const signedAtStr = r.signedAt ? new Date(r.signedAt).toLocaleString('fr-BE') : '';

  doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
  doc.text('SIGNATURE CLIENT', left, y);
  doc.text('SIGNATURE GOODVIBES', sigCol2X, y);
  y += 8;
  try{ doc.addImage(r.signatureImg, 'PNG', left, y, 150, 58); }catch(e){}
  try{ doc.addImage(GV_SIGNATURE, 'PNG', sigCol2X, y, 150, 58); }catch(e){}
  y += 62;
  doc.setDrawColor(...LINE); doc.line(left, y, left+sigColW, y);
  doc.line(sigCol2X, y, sigCol2X+sigColW, y);
  y += 12;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text(r.clientName || '', left, y);
  doc.text('Simon Benali, Goodvibes', sigCol2X, y);
  y += 12;
  doc.setFontSize(8); doc.setTextColor(...MUTED);
  doc.text('Horodatage : ' + signedAtStr, left, y);
  doc.text('Horodatage : ' + signedAtStr, sigCol2X, y);
  y += 28;

  // --- FOOTER (sur chaque page) ---
  const pageCount = doc.internal.getNumberOfPages();
  for(let p=1; p<=pageCount; p++){
    doc.setPage(p);
    doc.setDrawColor(...LINE);
    doc.line(left, H-56, right, H-56);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text('Goodvibes, Avenue Louise 367, 1050 Bruxelles', left, H-40);
    doc.text('www.goodvibes.be', right, H-40, {align:'right'});
  }

  const filename = `Goodvibes_${(r.event||'contrat').replace(/[^a-z0-9]+/gi,'_')}_${(r.clientName||'client').replace(/[^a-z0-9]+/gi,'_')}.pdf`;
  return { doc, filename };
}

async function generatePDF(r){
  const { doc, filename } = await buildPDFDoc(r);
  doc.save(filename);
}

/* ============================ GOOGLE SHEET + EMAIL (Apps Script) ============================
   Fonctionne sans backend perso, via un Google Apps Script déployé en
   Application Web. Chaque contrat signé : (1) s'ajoute comme ligne dans
   votre Google Sheet, (2) part par email à vous et au client, PDF joint.

   MISE EN PLACE (une seule fois, gratuite) :
   1. Créez un Google Sheet vide.
   2. Extensions → Apps Script → collez le code fourni par Goodvibes/Claude.
   3. Déployer → Nouveau déploiement → Application Web →
      Exécuter en tant que "moi", Accès "Tout le monde".
   4. Collez ici l'URL obtenue (se termine par /exec). Note : la constante
      APPS_SCRIPT_URL est déclarée plus haut dans le fichier (elle sert
      aussi aux liens courts), pas besoin d'y retoucher ici. */

async function sendToGoogleSheet(record){
  if(APPS_SCRIPT_URL === "YOUR_APPS_SCRIPT_URL") return; // pas encore configuré
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // évite le préflight CORS (Apps Script ne le gère pas)
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record)
    });
  }catch(e){ console.error('Apps Script error', e); }
}
